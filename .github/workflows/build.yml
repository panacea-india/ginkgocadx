name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # The build image is amd64 only (see ci/Dockerfile).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ci
          file: ci/Dockerfile
          tags: ginkgocadx-build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Ginkgo CADx
        run: |
          docker run --rm -v "$PWD":/src ginkgocadx-build \
            ci/build.sh ${{ matrix.build_type }}
